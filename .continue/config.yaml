# Continue.dev Configuration for {{PROJECT_NAME}}
# Reference: https://docs.continue.dev/reference
# AI-augmented development workflow

name: "{{PROJECT_NAME}} Continue Config"
version: "1.0.0"
schema: v1

# ============================================
# MODELS CONFIGURATION
# ============================================
models:
  # Primary chat model - Claude for complex reasoning
  - name: "claude-sonnet"
    provider: "anthropic"
    model: "claude-sonnet-4-20250514"
    apiKey: "${ANTHROPIC_API_KEY}"
    contextLength: 200000
    requestOptions:
      timeout: 120000
      maxRetries: 3
      temperature: 0.7

  # Fast model for autocomplete and quick tasks
  - name: "claude-haiku"
    provider: "anthropic"
    model: "claude-haiku-4-20250514"
    apiKey: "${ANTHROPIC_API_KEY}"
    contextLength: 200000
    requestOptions:
      temperature: 0.3

  # Alternative: Gemini for multimodal tasks
  - name: "gemini-flash"
    provider: "google"
    model: "gemini-2.0-flash-exp"
    apiKey: "${GOOGLE_AI_API_KEY}"
    contextLength: 1000000
    requestOptions:
      temperature: 0.7

  # Gemini thinking model for complex problems
  - name: "gemini-thinking"
    provider: "google"
    model: "gemini-2.0-flash-thinking-exp"
    apiKey: "${GOOGLE_AI_API_KEY}"
    contextLength: 32768
    requestOptions:
      temperature: 0.8

  # Local model fallback (if Ollama available)
  - name: "local-qwen"
    provider: "ollama"
    model: "qwen2.5-coder:14b"
    apiBase: "http://localhost:11434"
    contextLength: 32768

# Default model selection
chat: claude-sonnet
autocomplete: claude-haiku
embed: voyage-code-2

# ============================================
# TAB AUTOCOMPLETE
# ============================================
tabAutocomplete:
  model: claude-haiku
  maxPromptTokens: 4096
  debounceDelay: 350
  multilineCompletions: true
  useCache: true
  disableInFiles:
    - "*.json"
    - "*.yaml"
    - "*.yml"
    - "*.md"
    - "*.txt"
    - "*.env*"
    - "*.lock"
    - "package-lock.json"
    - "pnpm-lock.yaml"

# ============================================
# EMBEDDINGS
# ============================================
embeddingsProvider:
  provider: "voyage"
  model: "voyage-code-2"
  apiKey: "${VOYAGE_API_KEY}"
  dimensions: 1536

# Codebase indexing
codebaseIndexing:
  enabled: true
  chunkSize: 512
  chunkOverlap: 50
  maxChunksPerFile: 100
  refreshInterval: 3600  # seconds
  ignorePatterns:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.git/**"
    - "**/coverage/**"
    - "**/.next/**"
    - "**/.nuxt/**"
    - "**/.cache/**"
    - "**/*.lock"
    - "**/*.log"
    - "**/*.min.js"
    - "**/*.min.css"

# ============================================
# RERANKING
# ============================================
reranker:
  provider: "voyage"
  model: "rerank-2"
  apiKey: "${VOYAGE_API_KEY}"

# ============================================
# CONTEXT PROVIDERS
# ============================================
contextProviders:
  # File context - specify files to include
  - name: "file"
    params:
      maxFiles: 20

  # Code search within codebase
  - name: "code"
    params:
      nResults: 10

  # Semantic codebase search using embeddings
  - name: "codebase"
    params:
      nResults: 15

  # Git diff context (staged/unstaged changes)
  - name: "diff"
    params:
      includeUnstaged: true
      includeStaged: true

  # Terminal output
  - name: "terminal"
    params:
      maxLines: 500

  # Currently open files in editor
  - name: "open"
    params:
      maxOpenFiles: 10

  # Documentation search
  - name: "docs"
    params:
      sites:
        - name: "TypeScript"
          startUrl: "https://www.typescriptlang.org/docs/"
          faviconUrl: "https://www.typescriptlang.org/favicon-32x32.png"
        - name: "React"
          startUrl: "https://react.dev/"
          faviconUrl: "https://react.dev/favicon.ico"
        - name: "Node.js"
          startUrl: "https://nodejs.org/docs/"
          faviconUrl: "https://nodejs.org/favicon.ico"
        - name: "Next.js"
          startUrl: "https://nextjs.org/docs"
          faviconUrl: "https://nextjs.org/favicon.ico"
        - name: "Prisma"
          startUrl: "https://www.prisma.io/docs"
          faviconUrl: "https://www.prisma.io/favicon.ico"

  # Web search for real-time information
  - name: "web"
    params:
      provider: "perplexity"
      apiKey: "${PERPLEXITY_API_KEY}"

  # Fetch content from URLs
  - name: "url"

  # Folder context
  - name: "folder"
    params:
      maxDepth: 3

  # Problems/diagnostics from editor
  - name: "problems"

  # Currently highlighted/selected code
  - name: "highlighted"

  # Recent git commits
  - name: "commits"
    params:
      maxCommits: 10

# ============================================
# SLASH COMMANDS
# ============================================
slashCommands:
  # Built-in commands
  - name: "edit"
    description: "Edit selected code"
    
  - name: "comment"
    description: "Add comments to code"
    
  - name: "share"
    description: "Share conversation"
    
  - name: "cmd"
    description: "Generate shell command"
    
  - name: "commit"
    description: "Generate commit message"
    prompt: |
      Generate a conventional commit message for these changes.
      Follow the format: type(scope): subject
      
      Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore
      
      Keep subject under 50 characters.
      Include body if changes are complex.
      Reference Linear issue if applicable (e.g., "Closes PRX-123")

  # Custom commands for {{PROJECT_NAME}}
  - name: "review"
    description: "Review code for issues"
    prompt: |
      Review the following code as a senior software engineer.
      Reference the style guide at .gemini/styleguide.md
      
      Check for:
      1. 🔴 CRITICAL: Security vulnerabilities, data loss risks
      2. 🟠 WARNINGS: Performance issues, incorrect error handling
      3. 🟡 SUGGESTIONS: Code clarity, missing tests, style violations
      
      For each issue:
      - Quote the problematic code
      - Explain why it's an issue
      - Suggest a specific fix with code example
      
      Be constructive and specific.

  - name: "test"
    description: "Generate tests for code"
    prompt: |
      Generate comprehensive tests for this code using Vitest.
      
      Requirements:
      - Cover all public functions/methods
      - Test happy path and edge cases
      - Test error conditions
      - Mock external dependencies
      - Use AAA pattern (Arrange, Act, Assert)
      - Descriptive test names
      - Aim for 100% code coverage
      
      Test structure:
      ```typescript
      describe('ComponentName', () => {
        describe('methodName', () => {
          it('should do X when Y', async () => {
            // Arrange
            // Act
            // Assert
          });
        });
      });
      ```

  - name: "doc"
    description: "Generate JSDoc documentation"
    prompt: |
      Generate comprehensive JSDoc documentation for this code.
      
      Include:
      - Brief description of purpose
      - @param for all parameters with types
      - @returns for return value with type
      - @throws for all error conditions
      - @example blocks demonstrating usage
      - @since version tag
      
      Example:
      ```typescript
      /**
       * Retrieves a user by their unique identifier.
       *
       * @param userId - The unique identifier of the user
       * @returns A promise that resolves to the user object
       * @throws {ValidationError} If userId format is invalid
       * @throws {NotFoundError} If user doesn't exist
       *
       * @example
       * ```typescript
       * const user = await getUserById('user_123');
       * console.log(user.name);
       * ```
       *
       * @since 1.0.0
       */
      ```

  - name: "linear"
    description: "Create Linear issue from context"
    prompt: |
      Create a Linear issue based on the current context.
      
      Format:
      
      **Title:** Clear, actionable title (50 chars max)
      
      **Description:**
      Brief overview of what needs to be done and why.
      
      **Acceptance Criteria:**
      - [ ] Criterion 1
      - [ ] Criterion 2
      - [ ] Criterion 3
      
      **Technical Notes:**
      - Implementation details
      - Files to modify
      - Dependencies or blockers
      - Estimated complexity: S/M/L/XL
      
      **Testing:**
      - Test scenarios to cover
      
      **Related:**
      - Linear issues: PRX-XXX
      - PRs: #XXX
      - Notion specs: [link]

  - name: "spec"
    description: "Generate Notion spec from code"
    prompt: |
      Create a Notion-compatible specification document.
      
      # Feature Name
      
      ## Overview
      High-level description and business value
      
      ## Requirements
      ### Functional Requirements
      - REQ-1: Description
      
      ### Non-Functional Requirements
      - Performance, security, scalability
      
      ## Technical Design
      ### Architecture
      - System components and data flow
      
      ### API Contracts
      ```typescript
      // Request/response schemas
      ```
      
      ### Data Models
      ```typescript
      // Entity definitions
      ```
      
      ## Implementation Plan
      1. Phase 1: ...
      2. Phase 2: ...
      
      ## Testing Strategy
      - Unit, integration, E2E tests
      
      ## Rollout Plan
      - Feature flags, monitoring, rollback
      
      ## Open Questions
      - Question 1?

  - name: "fix"
    description: "Fix the selected code"
    prompt: |
      Fix any bugs or issues in this code.
      
      Check for:
      - Logic errors
      - Type errors
      - Null/undefined handling
      - Edge cases
      - Error handling
      - Performance issues
      
      Provide the corrected code with explanations.

  - name: "optimize"
    description: "Optimize code for performance"
    prompt: |
      Optimize this code for better performance.
      
      Consider:
      - Algorithm complexity (time and space)
      - Database query optimization
      - Caching opportunities
      - Parallel execution (Promise.all)
      - Unnecessary computations
      - Memory usage
      
      Provide optimized code with before/after metrics if possible.

  - name: "refactor"
    description: "Refactor code for better maintainability"
    prompt: |
      Refactor this code to improve maintainability.
      
      Apply:
      - SOLID principles
      - DRY (Don't Repeat Yourself)
      - Single responsibility
      - Clear naming
      - Extract reusable functions
      - Simplify complex logic
      
      Ensure functionality remains the same.

# ============================================
# CUSTOM PROMPTS
# ============================================
prompts:
  - name: "system"
    description: "Default system prompt"
    prompt: |
      You are an expert software engineer working on {{PROJECT_NAME}}.
      
      PROJECT CONTEXT:
      - Type: {{PROJECT_TYPE}}
      - Description: {{PROJECT_DESCRIPTION}}
      - Domain: {{PROJECT_DOMAIN}}
      
      GUIDELINES:
      - Adhere to coding standards in .gemini/styleguide.md
      - Use TypeScript with strict mode
      - Write comprehensive tests for new code
      - Use conventional commit messages
      - Document all public APIs with JSDoc
      - Validate all user inputs
      - Handle errors gracefully
      - Never log sensitive data
      
      TECH STACK:
      - Team: {{TEAM_LABEL}}
      - Branch naming: {{USER}}/PRX-XXX-description
      - Testing: Vitest
      - Package manager: pnpm
      - ORM: Prisma (if applicable)
      
      Always explain your reasoning and ask for clarification when needed.

  - name: "code-review"
    description: "Code review prompt"
    prompt: |
      Review this code as a senior engineer with 10+ years experience.
      
      Focus on:
      1. **Correctness**: Logic errors, edge cases, null handling
      2. **Security**: Input validation, injection risks, auth issues
      3. **Performance**: N+1 queries, memory leaks, unnecessary work
      4. **Maintainability**: Code clarity, naming, documentation
      5. **Testing**: Coverage and quality
      6. **Style**: Adherence to .gemini/styleguide.md
      
      Rate severity:
      - 🔴 CRITICAL: Must fix before merge
      - 🟠 WARNING: Should fix soon
      - 🟡 SUGGESTION: Nice to have
      - 🟢 PRAISE: Well done
      
      Be specific with code examples.

  - name: "architecture"
    description: "Architecture discussion prompt"
    prompt: |
      Analyze this code/design from an architectural perspective.
      
      Evaluate:
      1. **SOLID Principles**: Single responsibility, Open/closed, etc.
      2. **Separation of Concerns**: Is logic properly separated?
      3. **Coupling**: Are components loosely coupled?
      4. **Testability**: How easy is it to test?
      5. **Scalability**: Will this scale as usage grows?
      6. **Maintainability**: Can others understand and modify this?
      
      Provide:
      - Current state analysis
      - Trade-offs of current approach
      - Alternative approaches
      - Recommendations with rationale

  - name: "debug"
    description: "Debugging assistant prompt"
    prompt: |
      Help me debug this issue.
      
      Analyze:
      1. Error messages and stack traces
      2. Expected vs actual behavior
      3. Recent changes that might have caused this
      4. Potential root causes
      
      Provide:
      1. Likely cause of the issue
      2. Steps to verify the diagnosis
      3. Suggested fix with code example
      4. Prevention strategies for similar issues

# ============================================
# RULES (Project-specific guidance)
# ============================================
rules:
  - name: "typescript-strict"
    pattern: "**/*.ts"
    instructions: |
      Use strict TypeScript:
      - No `any` type (use `unknown` if needed)
      - Explicit return types for functions
      - Proper null/undefined handling
      - Use const assertions where appropriate
      - Prefer interfaces for objects, types for unions

  - name: "react-components"
    pattern: "**/*.tsx"
    instructions: |
      React best practices:
      - Use functional components with hooks
      - Memoize expensive computations (useMemo)
      - Use React.memo for pure components
      - Extract custom hooks for reusable logic
      - Properly handle useEffect dependencies
      - Use TypeScript for all props

  - name: "api-routes"
    pattern: "**/api/**/*.ts"
    instructions: |
      API development standards:
      - Validate all inputs with Zod schemas
      - Return consistent response shapes
      - Use proper HTTP status codes
      - Handle errors with appropriate messages
      - Log errors with context (no sensitive data)
      - Implement rate limiting for public endpoints
      - Add authentication/authorization checks

  - name: "database"
    pattern: "**/prisma/**/*.ts"
    instructions: |
      Database best practices:
      - Use transactions for multi-step operations
      - Add indexes for frequently queried fields
      - Use select to fetch only needed fields
      - Implement pagination for list queries
      - Handle unique constraint violations
      - Use proper error handling

  - name: "tests"
    pattern: "**/*.test.ts"
    instructions: |
      Testing standards:
      - Use AAA pattern (Arrange, Act, Assert)
      - Mock external dependencies
      - Test happy path and edge cases
      - Test error conditions
      - Use descriptive test names
      - Aim for high coverage (80%+)
      - Keep tests focused and fast

# ============================================
# AGENT CONFIGURATION
# ============================================
agents:
  - name: "developer"
    model: claude-sonnet
    instructions: |
      You are a senior developer agent for {{PROJECT_NAME}}.
      
      Capabilities:
      - Read and write files
      - Execute terminal commands
      - Search the codebase
      - Create git commits
      - Access Linear and Notion via MCP
      
      Always:
      - Follow the style guide (.gemini/styleguide.md)
      - Write tests for new code
      - Document public APIs
      - Explain your actions
      - Ask for confirmation before destructive operations
      
    tools:
      - mcp: "filesystem"
      - mcp: "github"
      - mcp: "linear"
      - mcp: "notion"
      - builtin: "terminal"
      - builtin: "codebase"
      - builtin: "diff"

  - name: "reviewer"
    model: claude-sonnet
    instructions: |
      You are a code review agent.
      
      Focus on:
      - Security vulnerabilities
      - Performance issues
      - Code quality and maintainability
      - Test coverage
      - Style guide compliance
      
      Be:
      - Constructive and specific
      - Evidence-based
      - Helpful, not critical
      
    tools:
      - mcp: "github"
      - builtin: "diff"
      - builtin: "codebase"
      - builtin: "problems"

  - name: "tester"
    model: claude-haiku
    instructions: |
      You are a test generation agent.
      
      Generate:
      - Comprehensive unit tests
      - Integration tests where appropriate
      - Edge case tests
      - Error condition tests
      
      Use:
      - Vitest as testing framework
      - AAA pattern
      - Descriptive test names
      - Proper mocking
      
    tools:
      - builtin: "codebase"
      - builtin: "terminal"

# ============================================
# MCP SERVERS
# ============================================
# MCP servers are configured in .continue/mcpServers/mcp-servers.yaml
# This allows for shared configuration across AI tools

mcpServersConfigPath: ".continue/mcpServers/mcp-servers.yaml"

# ============================================
# EXPERIMENTAL FEATURES
# ============================================
experimental:
  useChainOfThought: true
  streamOutput: true
  parallelToolCalls: true
  contextCollapsing: true
  agentMode: true

# ============================================
# UI PREFERENCES
# ============================================
ui:
  theme: "dark"  # dark | light | system
  fontSize: 14
  fontFamily: "JetBrains Mono, Fira Code, Consolas, monospace"
  showLineNumbers: true
  showContextProviders: true
  showSlashCommands: true

# ============================================
# TELEMETRY & ANALYTICS
# ============================================
telemetry:
  enabled: false  # Respect privacy

# ============================================
# WORKSPACE SETTINGS
# ============================================
workspace:
  name: "{{PROJECT_NAME}}"
  type: "{{PROJECT_TYPE}}"
  
  # Files to always include in context
  alwaysInclude:
    - "README.md"
    - "package.json"
    - "tsconfig.json"
    - ".gemini/styleguide.md"
    - "CONTRIBUTING.md"
  
  # Patterns to ignore
  ignore:
    - "node_modules"
    - "dist"
    - "build"
    - ".git"
    - "coverage"
    - ".next"
    - ".nuxt"
    - "*.lock"
    - "*.log"

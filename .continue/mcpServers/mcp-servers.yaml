# ============================================
# CONFIGURATION NOTES
# ============================================
# 
# Environment Variables:
# - All ${VAR_NAME} placeholders are replaced at runtime
# - Required vars: GITHUB_TOKEN, LINEAR_API_KEY, NOTION_API_KEY
# - Optional vars: BRAVE_API_KEY, MEM0_API_KEY, CONTEXT7_API_KEY
# 
# Security:
# - Never commit actual tokens/keys to git
# - Use .env file for local development
# - Use GitHub Secrets for CI/CD
# - Filesystem server denies access to sensitive patterns
# 
# Performance:
# - Connection timeouts prevent hanging AI sessions
# - Use shorter timeouts (5-10s) for local servers
# - Use longer timeouts (15-20s) for external APIs
# 
# Debugging:
# - Set NODE_ENV=development for verbose logging
# - Check MCP server logs in ~/.continue/logs/
# - Test individual servers with: npx @anthropic/mcp-server-<name> --help
# 
# Custom Servers:
# - Create custom MCP servers for project-specific needs
# - Follow the MCP protocol specification
# - Deploy as npm packages or standalone services
# 
# References:
# - MCP Specification: https://modelcontextprotocol.io
# - Continue.dev MCP Guide: https://docs.continue.dev/features/mcp
# - Available MCP Servers: https://github.com/anthropics/mcp-servers

# Continue.dev MCP Server Configuration for {{PROJECT_NAME}}
# Reference: https://docs.continue.dev/features/mcp
# Model Context Protocol server definitions

name: "{{PROJECT_NAME}} MCP Stack"
version: "1.0.0"
schema: v1

# ============================================
# MCP SERVERS
# ============================================
mcpServers:
  # --------------------------------------------
  # FILESYSTEM SERVER
  # Local file operations with safety guardrails
  # Allows AI to read/write files in allowed directories
  # --------------------------------------------
  - name: "filesystem"
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-filesystem"
      - "--allowed-directories"
      - "${workspaceFolder}"
      - "${workspaceFolder}/src"
      - "${workspaceFolder}/tests"
      - "${workspaceFolder}/docs"
      - "--denied-patterns"
      - "**/.env*"
      - "**/*.key"
      - "**/*.pem"
      - "**/secrets/**"
      - "**/node_modules/**"
      - "**/.git/**"
    env:
      NODE_ENV: "production"
    connectionTimeout: 10000
    description: "Safe file system operations for AI"

  # --------------------------------------------
  # GITHUB SERVER
  # Repository operations, PRs, issues, workflows
  # Enables AI to interact with GitHub
  # --------------------------------------------
  - name: "github"
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-github"
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_OWNER: "{{GITHUB_OWNER}}"
      GITHUB_REPO: "{{GITHUB_REPOSITORY}}"
    connectionTimeout: 15000
    description: "GitHub integration for repo operations"

  # --------------------------------------------
  # LINEAR SERVER
  # Issue tracking and project management
  # Allows AI to create/update Linear issues
  # --------------------------------------------
  - name: "linear"
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-linear"
    env:
      LINEAR_API_KEY: "${LINEAR_API_KEY}"
      LINEAR_TEAM_ID: "{{LINEAR_TEAM_ID}}"
      LINEAR_TEAM_KEY: "PAR"
    connectionTimeout: 15000
    description: "Linear issue tracking integration"

  # --------------------------------------------
  # NOTION SERVER
  # Documentation and specification management
  # Enables AI to read/write Notion pages
  # --------------------------------------------
  - name: "notion"
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-notion"
    env:
      NOTION_API_KEY: "${NOTION_API_KEY}"
      NOTION_SPEC_DATABASE_ID: "{{NOTION_SPEC_DATABASE_ID}}"
      NOTION_WIKI_PAGE_ID: "{{NOTION_WIKI_PAGE_ID}}"
    connectionTimeout: 15000
    description: "Notion documentation integration"

  # --------------------------------------------
  # WEB SEARCH SERVER (Brave Search)
  # Real-time web search for documentation and answers
  # Helps AI find up-to-date information
  # --------------------------------------------
  - name: "web-search"
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-brave-search"
    env:
      BRAVE_API_KEY: "${BRAVE_API_KEY}"
    connectionTimeout: 20000
    description: "Web search for documentation and research"

  # --------------------------------------------
  # MEMORY SERVER (mem0)
  # Persistent context and learning across sessions
  # Enables AI to remember project-specific context
  # --------------------------------------------
  - name: "memory"
    command: "npx"
    args:
      - "-y"
      - "@mem0/mcp-server"
    env:
      MEM0_API_KEY: "${MEM0_API_KEY}"
      MEM0_USER_ID: "${USER_ID:-clduab11}"
      MEM0_PROJECT_ID: "{{PROJECT_NAME}}"
    connectionTimeout: 10000
    description: "Persistent memory across AI sessions"

  # --------------------------------------------
  # CONTEXT7 SERVER
  # Library documentation and API reference lookup
  # Provides up-to-date docs for popular libraries
  # --------------------------------------------
  - name: "context7"
    command: "npx"
    args:
      - "-y"
      - "@upstash/context7-mcp"
    env:
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY}"
    connectionTimeout: 15000
    description: "Library documentation lookup"

  # --------------------------------------------
  # GIT SERVER
  # Advanced git operations beyond GitHub API
  # Enables complex git workflows
  # --------------------------------------------
  - name: "git"
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-git"
      - "--repository"
      - "${workspaceFolder}"
    env:
      GIT_AUTHOR_NAME: "${GIT_AUTHOR_NAME:-AI Assistant}"
      GIT_AUTHOR_EMAIL: "${GIT_AUTHOR_EMAIL:-ai@{{PROJECT_DOMAIN}}}"
    connectionTimeout: 10000
    description: "Advanced git operations"

  # --------------------------------------------
  # SEQUENTIAL THINKING SERVER
  # Breaks down complex problems step-by-step
  # Improves AI reasoning for difficult tasks
  # --------------------------------------------
  - name: "sequential-thinking"
    command: "npx"
    args:
      - "-y"
      - "@anthropic/mcp-server-sequential-thinking"
    connectionTimeout: 10000
    description: "Step-by-step problem solving"


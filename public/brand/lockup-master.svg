<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" role="img" aria-label="Skeletor">
  <title>Skeletor</title>
  <!-- Master lockup: mark + wordmark, vertically centered. -->
